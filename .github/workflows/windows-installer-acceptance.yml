name: Windows Installer Acceptance

on:
  push:
    branches:
      - feature/orax-flutter-appwrite-integration
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-installer-acceptance:
    name: Build, install SQL Server, and run Orax Hotel on Windows
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      APP_PORT: 5080

    steps:
      - name: Checkout tested source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Build installer from current source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pwsh -NoProfile -ExecutionPolicy Bypass -File .\installer\Build-Installer.ps1 -Configuration Release -Runtime win-x64 -OutputDir build-output
          $installer = Join-Path $env:GITHUB_WORKSPACE 'installer\build-output\installer\OraxHotel-Setup.exe'
          if (-not (Test-Path $installer)) { throw "Source build did not produce $installer" }
          "installer_path=$installer" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "installer_sha256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "source_commit=$env:GITHUB_SHA" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "installer_sha256=$hash" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "installer_bytes=$((Get-Item $installer).Length)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Verify generated installer PE format
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bytes = [System.IO.File]::ReadAllBytes($env:installer_path)
          if ($bytes.Length -lt 2 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw 'Generated installer is not a Windows PE file.' }
          if ((Get-Item $env:installer_path).Length -lt 300MB) { throw 'Generated installer is unexpectedly small.' }

      - name: Install and verify SQL Server Express prerequisite
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sqlMedia = Join-Path $env:RUNNER_TEMP 'SQLEXPR_x64_ENU.exe'
          $sqlUrl = 'https://download.microsoft.com/download/7/c/1/7c14e92e-bdcb-4f89-b7cf-93543e7112d1/SQLEXPR_x64_ENU.exe'
          $expectedSize = 261082544
          $expectedHash = 'BEA033E778048748EB1C87BF57597F7F5449B6A15BAC55DDC08263C57F7A1CA8'
          Invoke-WebRequest -Uri $sqlUrl -OutFile $sqlMedia -UseBasicParsing
          if ((Get-Item $sqlMedia).Length -ne $expectedSize) { throw 'SQL Server media size mismatch.' }
          $actualHash = (Get-FileHash $sqlMedia -Algorithm SHA256).Hash.ToUpperInvariant()
          if ($actualHash -ne $expectedHash) { throw "SQL Server media SHA-256 mismatch: $actualHash" }
          $account = "$env:USERDOMAIN\$env:USERNAME"
          $args = @('/Q','/ACTION=Install','/FEATURES=SQL','/INSTANCENAME=SQLEXPRESS',"/SQLSYSADMINACCOUNTS=$account",'/SQLSVCSTARTUPTYPE=Automatic','/TCPENABLED=1','/IACCEPTSQLSERVERLICENSETERMS')
          $sqlProcess = Start-Process -FilePath $sqlMedia -ArgumentList $args -Wait -PassThru -WorkingDirectory $env:RUNNER_TEMP
          if ($sqlProcess.ExitCode -ne 0 -and $sqlProcess.ExitCode -ne 3010) { throw "SQL Server Express prerequisite failed: exit=$($sqlProcess.ExitCode)" }
          $deadline = (Get-Date).AddMinutes(5)
          do {
            Start-Sleep -Seconds 5
            $service = Get-Service -Name 'MSSQL$SQLEXPRESS' -ErrorAction SilentlyContinue
          } while (($null -eq $service -or $service.Status -ne 'Running') -and (Get-Date) -lt $deadline)
          if ($null -eq $service -or $service.Status -ne 'Running') { throw 'SQLEXPRESS did not become Running after prerequisite installation.' }
          "sql_prerequisite=running" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Run Orax Hotel installer from tested source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $log = Join-Path $env:RUNNER_TEMP 'orax-installer.log'
          $stdout = Join-Path $env:RUNNER_TEMP 'orax-installer.stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'orax-installer.stderr.log'
          $process = Start-Process -FilePath $env:installer_path -Wait -PassThru -WorkingDirectory $env:RUNNER_TEMP -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          "installer_exit_code=$($process.ExitCode)" | Out-File -FilePath $log -Encoding utf8
          if (Test-Path $stdout) { Get-Content $stdout; Get-Content $stdout | Add-Content $log }
          if (Test-Path $stderr) { Get-Content $stderr; Get-Content $stderr | Add-Content $log }
          if ($process.ExitCode -ne 0) { throw "Orax installer failed with exit code $($process.ExitCode). See captured stdout/stderr." }
          $installedApp = Join-Path $env:LOCALAPPDATA 'OraxHotel\HotelSys.exe'
          if (-not (Test-Path $installedApp)) { throw "HotelSys.exe was not installed at $installedApp" }

      - name: Verify SQL Server and Hotel database
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $service = Get-Service -Name 'MSSQL$SQLEXPRESS' -ErrorAction Stop
          if ($service.Status -ne 'Running') { throw "SQL Server service is not running: $($service.Status)" }
          $connection = New-Object System.Data.SqlClient.SqlConnection
          $connection.ConnectionString = 'Server=.\SQLEXPRESS;Database=master;Integrated Security=True;TrustServerCertificate=True;Connection Timeout=30'
          $connection.Open()
          $command = $connection.CreateCommand()
          $command.CommandText = "SELECT DB_ID('Hotel_alkheer')"
          $databaseId = $command.ExecuteScalar()
          $connection.Close()
          if ($null -eq $databaseId -or $databaseId -eq [DBNull]::Value) { throw 'Hotel_alkheer database was not found.' }
          "sql_service=$($service.Status)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "hotel_database_id=$databaseId" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Start Orax and verify health endpoint
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $appDir = Join-Path $env:LOCALAPPDATA 'OraxHotel'
          $env:ASPNETCORE_URLS = "http://127.0.0.1:$env:APP_PORT"
          $app = Start-Process -FilePath (Join-Path $appDir 'HotelSys.exe') -WorkingDirectory $appDir -PassThru
          try {
            $healthy = $false
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Seconds 2
              try {
                $response = Invoke-WebRequest -Uri "http://127.0.0.1:$env:APP_PORT/api/appwrite/health" -UseBasicParsing -TimeoutSec 5
                if ($response.StatusCode -eq 200 -or $response.StatusCode -eq 401) { $healthy = $true; break }
              } catch { }
            }
            if (-not $healthy) { throw 'Orax did not respond on the local HTTP endpoint within 60 seconds.' }
            "orax_health_endpoint_reached=true" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }
          finally {
            if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force }
          }

      - name: Upload Windows acceptance diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orax-windows-acceptance-${{ github.run_id }}
          path: |
            ${{ runner.temp }}\orax-installer.log
            ${{ runner.temp }}\orax-installer.stdout.log
            ${{ runner.temp }}\orax-installer.stderr.log
          if-no-files-found: warn
